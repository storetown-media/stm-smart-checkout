name: Quality gates

on:
  push:
  pull_request:

jobs:
  php-lint:
    name: PHP syntax (php -l)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.0', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: WordPress Plugin Check (PCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          # All five categories, named explicitly. They are also the action's
          # default, but a default can change under us — and "security" and
          # "plugin_repo" are exactly the two we must not silently lose.
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility
          # Every error blocks the merge — the same gate wp.org applies on submission.
          exclude-directories: '.github'
          # Repo-only files; build-zip.py ships neither.
          exclude-files: |
            .gitignore
            phpcs.xml.dist

  plugin-check-package:
    name: Plugin Check on the shipped package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reduce the checkout to what actually ships
        # The job above checks the REPOSITORY; wp.org receives the ZIP, which has
        # neither .wordpress-org nor phpcs.xml.dist in it. Checking one and
        # shipping the other is how a defect survives to submission. The list
        # comes from .distignore — the same file build-zip.py builds from, so the
        # two cannot drift apart.
        run: |
          set -e
          while IFS= read -r zeile; do
            zeile="${zeile%%#*}"
            zeile="$(echo "$zeile" | xargs || true)"
            [ -z "$zeile" ] && continue
            [ "$zeile" = ".git/" ] && continue   # der Runner braucht es noch
            rm -rf -- "$zeile"
          done < .distignore
          echo "--- Das geht an wp.org: ---"
          find . -type f -not -path './.git/*' | sed 's|^\./||' | sort
          test -f stm-smart-checkout.php || { echo "::error::main plugin file missing"; exit 1; }
          test -f readme.txt            || { echo "::error::readme.txt missing"; exit 1; }
          for weg in .wordpress-org phpcs.xml.dist .github; do
            [ -e "$weg" ] && { echo "::error::$weg survived the reduction"; exit 1; }
          done
          exit 0

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          categories: |
            general
            plugin_repo
            security
            performance
            accessibility

  phpcs:
    name: Security & PHP 7.4 compatibility (PHPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr
      - name: Install PHPCS with the WordPress and PHPCompatibility rulesets
        run: |
          set -e
          composer init --quiet --no-interaction --name=stm/smart-checkout-cs
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction --no-progress \
            wp-coding-standards/wpcs:^3.1 \
            phpcompatibility/phpcompatibility-wp:^2.1
      - name: Verify PHPCS actually inspected the plugin
        # A run over zero files passes just as green as a clean one. Count what
        # was inspected and compare it against the PHP files on disk, so a
        # broken path or an over-eager exclude-pattern fails loudly instead of
        # quietly reporting success.
        run: |
          set -e
          erwartet=$(find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' | wc -l)
          # -q ist Pflicht: das Ruleset schaltet den Fortschrittsanzeiger ein, und
          # dessen Punkte landen auf stdout — mitten im JSON, das jq lesen soll.
          geprueft=$(vendor/bin/phpcs -q --report=json 2>/dev/null | jq '.files | length' 2>/dev/null || echo 0)
          echo "PHP-Dateien im Baum: $erwartet — von PHPCS geprüft: $geprueft"
          if [ "$geprueft" -lt "$erwartet" ]; then
            echo "::error::PHPCS inspected $geprueft of $erwartet PHP files — the ruleset is not reaching the code."
            exit 1
          fi

      - name: Run PHPCS
        # Config lives in phpcs.xml.dist: WordPress.Security, WordPress.DB,
        # I18n, and PHPCompatibility against the 7.4 floor the header promises.
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
